plugins {
    id 'java'
    id 'application'
    id 'io.freefair.lombok' version '8.6'
    id 'com.google.protobuf' version '0.10.0'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'org.photonflight'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainModule.set('org.photonflight.core')
    mainClass.set('org.photonflight.core.Application')
}

def junitVersion = '5.12.1'
dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"

    // Google Auto
    compileOnly 'com.google.auto.service:auto-service-annotations:1.1.1'
    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'

    // Google Guice
    implementation "com.google.inject:guice:7.0.0"

    // LAS and compressed LAZ decoding in the JVM
    implementation 'com.github.mreutegg:laszip4j:0.21'

    // GRPC Protobuf
    implementation 'com.google.protobuf:protobuf-java:4.36.2'
    implementation 'io.grpc:grpc-protobuf:1.84.1'
    implementation 'io.grpc:grpc-stub:1.84.1'
    implementation 'io.grpc:grpc-netty-shaded:1.84.1'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.36.2'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.84.1'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

sourceSets {
    main {
        proto {
            srcDir 'proto'
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('shadowJar') {
    archiveFileName = 'photoncore.jar'
    manifest {
        attributes 'Main-Class': application.mainClass.get(), 'Multi-Release': 'true'
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()

    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/SIG-*'
    exclude 'module-info.class', 'META-INF/versions/**/module-info.class'
    ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt'].each { resource ->
        filesMatching(resource) { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
        append(resource)
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
